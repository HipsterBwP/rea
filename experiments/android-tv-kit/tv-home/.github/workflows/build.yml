name: Build TV Home

# Every push to main builds the APK and publishes it as a GitHub release,
# which is the only place the TV installs it from.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Same signing key across builds, so updates install over the old version.
      # If the cache expires (7 days unused), the next update needs an uninstall first.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tv-home-signing-key-v1

      - name: Build
        run: gradle --no-daemon :app:assembleDebug
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.${{ github.run_number }}
        run: |
          apk="tv-home-$TAG.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk"
          gh release create "$TAG" "$apk" --target "$GITHUB_SHA" \
            --title "TV Home $TAG" --notes "Built by GitHub Actions from $GITHUB_SHA."
